<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TypeZero Cloud 管理后台</title>
  <style>
    :root {
      --bg: #F6F5F0; --card: #FDFCF9; --well: #EAE6DB; --ink: #17161B; --muted: #66646D;
      --violet: #5A46E8; --lilac: #ECE9FB; --green: #14804A; --green-bg: #E3F5EA;
      --amber: #C76F0E; --amber-bg: #FCF2E1; --red: #D1323C; --line: rgba(23,22,27,.1);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, "Segoe UI", "Microsoft YaHei UI", sans-serif; background: var(--bg); color: var(--ink); padding: 24px 18px 60px; }
    .wrap { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
    header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
    h1 { margin: 0; font-size: 24px; font-family: Georgia, "Songti SC", serif; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
    .kpi-val { font-size: 26px; font-weight: 700; font-family: Georgia, serif; color: var(--violet); }
    .kpi-label { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    input, button { font-family: inherit; font-size: 13px; border-radius: 8px; }
    input { padding: 8px 11px; border: 1px solid var(--line); background: #fff; }
    button { padding: 8px 14px; border: none; cursor: pointer; font-weight: 600; background: var(--violet); color: #fff; }
    button.sec { background: var(--well); color: var(--ink); }
    button.red { background: rgba(209,50,60,.12); color: var(--red); }
    .pill { display: inline-block; padding: 3px 9px; border-radius: 99px; font-size: 11px; font-weight: 600; }
    .ok { background: var(--green-bg); color: var(--green); }
    .warn { background: var(--amber-bg); color: var(--amber); }
    table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 600; }
    .mono { font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>TypeZero Cloud · 体验额度与预算控制台</h1>
      </div>
      <div class="row" id="authBar">
        <input id="adminToken" type="password" placeholder="输入管理员密钥 (ADMIN_TOKEN)" style="width:260px" />
        <button onclick="login()">进入后台</button>
      </div>
    </header>

    <div id="app" class="hidden" style="display:flex;flex-direction:column;gap:18px;">
      <div class="card row" id="envBadges"></div>

      <div class="kpis" id="kpiGrid"></div>

      <div class="card">
        <h3 style="margin:0 0 12px;font-size:15px;">🎟️ 豆包语音兑换码（朋友专用 · 默认 500 分钟 ≈ ¥5）</h3>
        <div class="row" style="margin-bottom:12px;">
          <label>朋友备注 <input id="vNote" type="text" placeholder="如：老王 / Jeff" style="width:150px" /></label>
          <label>额度（分钟） <input id="vMinutes" type="number" step="10" min="1" value="500" style="width:95px" /></label>
          <label>生成数量 <input id="vCount" type="number" min="1" max="50" value="1" style="width:72px" /></label>
          <button onclick="createVouchers()">+ 生成兑换码</button>
        </div>
        <div id="newlyCreatedBox" class="hidden" style="background:var(--lilac);border:1px solid rgba(90,70,232,.22);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:12.5px;"></div>
        <div style="overflow-x:auto">
          <table>
            <thead>
              <tr><th>兑换码（点击复制）</th><th>备注</th><th>已用 / 总额度</th><th>剩余时长</th><th>听写次数</th><th>状态</th><th>操作</th></tr>
            </thead>
            <tbody id="vouchersBody"></tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <h3 style="margin:0 0 12px;font-size:15px;">🔔 飞书到期提醒通道 &amp; 全局熔断开关</h3>
        <div class="row" style="margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--line);">
          <input id="feishuUrl" type="text" placeholder="粘贴飞书机器人 Webhook（https://open.feishu.cn/open-apis/bot/v2/hook/...）" style="flex:1;min-width:280px" />
          <input id="feishuSecret" type="password" placeholder="签名密钥（可选）" style="width:160px" />
          <button onclick="saveFeishu()">保存飞书通道</button>
          <button class="sec" onclick="testFeishu()">测试飞书提醒</button>
          <span id="feishuStatusHint" class="mono" style="color:var(--muted)"></span>
        </div>
        <div class="row">
          <label>新用户赠送 (¥) <input id="cfgBonus" type="number" step="0.1" style="width:90px" /></label>
          <label>每日上限 (¥) <input id="cfgDaily" type="number" step="1" style="width:95px" /></label>
          <label>总预算熔断 (¥) <input id="cfgTotal" type="number" step="10" style="width:105px" /></label>
          <label><input id="cfgTrial" type="checkbox" /> 开启新用户自动赠送</label>
          <label><input id="cfgRelay" type="checkbox" /> 开启免费中转总开关</label>
          <button onclick="saveSettings()">保存熔断配置</button>
          <button class="sec" onclick="loadOverview()">刷新数据</button>
        </div>
      </div>

      <div class="card">
        <h3 style="margin:0 0 10px;font-size:15px;">注册用户与余额管理</h3>
        <div style="overflow-x:auto">
          <table>
            <thead>
              <tr><th>邮箱</th><th>平台</th><th>剩余余额</th><th>累计消耗</th><th>语音时长</th><th>排版次数</th><th>状态</th><th>操作</th></tr>
            </thead>
            <tbody id="usersBody"></tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <h3 style="margin:0 0 10px;font-size:15px;">最近 60 条调用与成本流水</h3>
        <div style="overflow-x:auto">
          <table>
            <thead>
              <tr><th>时间</th><th>邮箱</th><th>服务</th><th>模型</th><th>计量</th><th>成本 (¥)</th></tr>
            </thead>
            <tbody id="logsBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    let token = sessionStorage.getItem("tz_admin_token") || "";
    if (token) {
      document.getElementById("adminToken").value = token;
      loadOverview();
    }

    function login() {
      token = document.getElementById("adminToken").value.trim();
      if (!token) return alert("请先输入管理员密钥");
      sessionStorage.setItem("tz_admin_token", token);
      loadOverview();
    }

    async function api(path, opts = {}) {
      const res = await fetch(path, {
        ...opts,
        headers: { "Content-Type": "application/json", "X-Admin-Token": token, ...(opts.headers || {}) },
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      return data;
    }

    async function loadOverview() {
      try {
        const d = await api("/api/admin/overview");
        document.getElementById("app").classList.remove("hidden");

        const env = d.envStatus;
        document.getElementById("envBadges").innerHTML = [
          ["豆包 Seed-ASR Key", env.volcAsrKeyConfigured],
          ["DeepSeek 4 Flash Key", env.deepseekKeyConfigured],
          ["飞书到期提醒", env.feishuWebhookConfigured],
          ["邮箱验证码 SMTP", env.smtpConfigured],
          ["Google 一键登录 OAuth", env.googleOAuthConfigured],
        ].map(([name, ok]) => `<span class="pill ${ok ? "ok" : "warn"}">${ok ? "✓" : "○"} ${name}</span>`).join("");

        document.getElementById("feishuStatusHint").textContent = d.feishuWebhookMasked ? `已配置：${d.feishuWebhookMasked}` : "未配置";

        const vouchers = d.vouchers || [];
        const activatedVouchers = vouchers.filter((v) => v.activated).length;
        const totalVoucherUsedMin = vouchers.reduce((acc, v) => acc + Number(v.usedMinutes || 0), 0);

        document.getElementById("kpiGrid").innerHTML = `
          <div class="card"><div class="kpi-val">${vouchers.length}</div><div class="kpi-label">豆包兑换码（已激活 ${activatedVouchers} · 累计 ${totalVoucherUsedMin.toFixed(1)} 分钟）</div></div>
          <div class="card"><div class="kpi-val">${d.totalUsers}</div><div class="kpi-label">邮箱注册用户（已领体验金 ${d.trialUsers}）</div></div>
          <div class="card"><div class="kpi-val">¥${d.budget.todaySpentCny.toFixed(3)}</div><div class="kpi-label">今日消耗 / 上限 ¥${d.budget.dailyBudgetCny}</div></div>
          <div class="card"><div class="kpi-val" style="color:${d.budget.withinBudget ? "var(--green)" : "var(--red)"}">${d.budget.withinBudget ? "运行中" : "已熔断"}</div><div class="kpi-label">累计 ¥${d.budget.totalSpentCny.toFixed(3)} / 上限 ¥${d.budget.totalBudgetCny}</div></div>
        `;

        document.getElementById("vouchersBody").innerHTML = vouchers.length === 0
          ? `<tr><td colspan="7" style="color:var(--muted);text-align:center;padding:16px;">尚未生成豆包语音兑换码，上方填好朋友备注和分钟数即可一键生成。</td></tr>`
          : vouchers.map((v) => {
              const pct = v.quotaMinutes > 0 ? Math.min(100, (v.usedMinutes / v.quotaMinutes) * 100) : 100;
              const fmtTime = (iso) => {
                if (!iso) return "";
                const dt = new Date(iso);
                return Number.isNaN(dt.getTime()) ? "" : dt.toLocaleString("zh-CN", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
              };
              const badge = v.revoked
                ? `<span class="pill warn" style="background:rgba(209,50,60,.12);color:var(--red);">已停用</span>`
                : v.exhausted
                  ? `<span class="pill warn" style="background:rgba(209,50,60,.12);color:var(--red);">已用完${v.notifiedExhausted ? "·已飞书提醒" : ""}</span>`
                  : v.remainingMinutes < 10
                    ? `<span class="pill warn">即将用完</span>`
                    : v.sessionCount > 0
                      ? `<span class="pill ok">使用中</span>`
                      : v.activated
                        ? `<span class="pill" style="background:var(--lilac);color:var(--violet);">✓ 已激活</span>`
                        : `<span class="pill" style="background:var(--well);color:var(--muted);">待激活</span>`;
              const subTime = v.lastUsedAt
                ? `最近 ${fmtTime(v.lastUsedAt)}`
                : v.activatedAt
                  ? `激活 ${fmtTime(v.activatedAt)}`
                  : "尚未绑定";
              return `
                <tr>
                  <td class="mono"><button class="sec" style="padding:4px 8px;font-family:ui-monospace,Consolas,monospace;" onclick="copyText('${v.code}')">${v.code} 📋</button></td>
                  <td>${escapeHtml(v.note || "-")}</td>
                  <td class="mono">
                    <div>${v.usedMinutes.toFixed(1)} / ${v.quotaMinutes.toFixed(0)} 分钟</div>
                    <div style="width:120px;height:5px;background:var(--well);border-radius:99px;margin-top:4px;overflow:hidden;">
                      <div style="width:${pct.toFixed(1)}%;height:100%;background:${v.exhausted ? "var(--red)" : "var(--violet)"};"></div>
                    </div>
                  </td>
                  <td class="mono"><strong>${v.remainingMinutes.toFixed(1)} 分钟</strong></td>
                  <td class="mono">${v.sessionCount}</td>
                  <td>
                    <div>${badge}</div>
                    <div style="font-size:10.5px;color:var(--muted);margin-top:3px;">${subTime}</div>
                  </td>
                  <td class="row">
                    <button class="sec" onclick="addVoucherMinutes('${v.code}', 500)">+500分</button>
                    <button class="sec" onclick="editVoucherQuota('${v.code}', ${v.quotaMinutes})">改额度</button>
                    <button class="${v.revoked ? "sec" : "red"}" onclick="toggleVoucherStatus('${v.code}', '${v.revoked ? "active" : "revoked"}')">${v.revoked ? "恢复" : "停用"}</button>
                  </td>
                </tr>
              `;
            }).join("");

        document.getElementById("cfgBonus").value = d.budget.trialBonusCny;
        document.getElementById("cfgDaily").value = d.budget.dailyBudgetCny;
        document.getElementById("cfgTotal").value = d.budget.totalBudgetCny;
        document.getElementById("cfgTrial").checked = d.budget.trialSignupEnabled;
        document.getElementById("cfgRelay").checked = d.budget.relayEnabled;

        document.getElementById("usersBody").innerHTML = d.users.map((u) => `
          <tr>
            <td class="mono">${u.email}</td>
            <td>${u.platform || "-"}</td>
            <td class="mono"><strong>¥${u.balanceCny.toFixed(3)}</strong></td>
            <td class="mono">¥${u.totalUsedCny.toFixed(4)}</td>
            <td class="mono">${u.asrSecondsUsed}s</td>
            <td class="mono">${u.llmRequestsUsed}</td>
            <td><span class="pill ${u.isBanned ? "warn" : "ok"}">${u.isBanned ? "已封禁" : "正常"}</span></td>
            <td class="row">
              <button class="sec" onclick="grant('${u.id}', 1)">+¥1</button>
              <button class="${u.isBanned ? "sec" : "red"}" onclick="toggleBan('${u.id}', ${!u.isBanned})">${u.isBanned ? "解封" : "封禁"}</button>
            </td>
          </tr>
        `).join("");

        document.getElementById("logsBody").innerHTML = d.recentLogs.map((l) => `
          <tr>
            <td class="mono">${l.created_at.slice(5, 19).replace("T", " ")}</td>
            <td class="mono">${l.email}</td>
            <td>${l.service.toUpperCase()}</td>
            <td class="mono">${l.model}</td>
            <td class="mono">${l.service === "asr" || l.service === "asr_voucher" ? l.units + "s" : l.units + " tok"}</td>
            <td class="mono">¥${l.costCny.toFixed(5)}</td>
          </tr>
        `).join("");
      } catch (e) {
        alert("加载失败：" + e.message);
      }
    }

    async function saveSettings() {
      try {
        await api("/api/admin/settings", {
          method: "POST",
          body: JSON.stringify({
            trialBonusCny: Number(document.getElementById("cfgBonus").value),
            dailyBudgetCny: Number(document.getElementById("cfgDaily").value),
            totalBudgetCny: Number(document.getElementById("cfgTotal").value),
            trialSignupEnabled: document.getElementById("cfgTrial").checked,
            relayEnabled: document.getElementById("cfgRelay").checked,
          }),
        });
        alert("熔断配置已保存并立即生效");
        loadOverview();
      } catch (e) {
        alert(e.message);
      }
    }

    async function grant(id, amountCny) {
      await api(`/api/admin/users/${id}/grant`, { method: "POST", body: JSON.stringify({ amountCny }) });
      loadOverview();
    }

    async function toggleBan(id, banned) {
      await api(`/api/admin/users/${id}/ban`, { method: "POST", body: JSON.stringify({ banned }) });
      loadOverview();
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]));
    }

    async function copyText(txt) {
      try {
        await navigator.clipboard.writeText(txt);
      } catch {
        prompt("请复制：", txt);
      }
    }

    async function createVouchers() {
      const note = document.getElementById("vNote").value.trim();
      const quotaMinutes = Number(document.getElementById("vMinutes").value || 500);
      const count = Number(document.getElementById("vCount").value || 1);
      try {
        const res = await api("/api/admin/vouchers", {
          method: "POST",
          body: JSON.stringify({ note, quotaMinutes, count }),
        });
        const box = document.getElementById("newlyCreatedBox");
        const list = res.vouchers || [];
        const codesText = list.map((v) => `${v.code}${v.note ? " (" + v.note + ")" : ""} · ${v.quotaMinutes} 分钟`).join("\n");
        const shareText = list.length === 1
          ? `这是你的 TypeZero 豆包语音兑换码：${list[0].code}（含 ${list[0].quotaMinutes} 分钟语音识别时长）。打开 TypeZero「引擎与快捷键 → 豆包流式语音大模型 2.0」，直接把兑换码粘贴到 API Key 输入框里点击「校验并生效」即可使用！`
          : codesText;
        box.innerHTML = `
          <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
            <div><strong>🎉 已生成 ${list.length} 个兑换码：</strong><span class="mono">${list.map((v) => v.code).join(" , ")}</span></div>
            <button class="sec" onclick="copyText(${JSON.stringify(shareText)})">一键复制发给朋友</button>
          </div>
        `;
        box.classList.remove("hidden");
        document.getElementById("vNote").value = "";
        loadOverview();
      } catch (e) {
        alert("生成失败：" + e.message);
      }
    }

    async function addVoucherMinutes(code, addMinutes) {
      await api(`/api/admin/vouchers/${encodeURIComponent(code)}/update`, {
        method: "POST",
        body: JSON.stringify({ addMinutes }),
      });
      loadOverview();
    }

    async function editVoucherQuota(code, currentMin) {
      const raw = prompt(`修改兑换码 ${code} 的总时长额度（单位：分钟）：`, String(currentMin));
      if (raw === null) return;
      const mins = Number(raw);
      if (!Number.isFinite(mins) || mins < 0) return alert("请输入有效数字");
      await api(`/api/admin/vouchers/${encodeURIComponent(code)}/update`, {
        method: "POST",
        body: JSON.stringify({ quotaMinutes: mins }),
      });
      loadOverview();
    }

    async function toggleVoucherStatus(code, status) {
      await api(`/api/admin/vouchers/${encodeURIComponent(code)}/update`, {
        method: "POST",
        body: JSON.stringify({ status }),
      });
      loadOverview();
    }

    async function saveFeishu() {
      const webhookUrl = document.getElementById("feishuUrl").value.trim();
      const secret = document.getElementById("feishuSecret").value.trim();
      if (!webhookUrl) return alert("请先粘贴飞书 Webhook 地址");
      try {
        await api("/api/admin/feishu/config", {
          method: "POST",
          body: JSON.stringify({ webhookUrl, secret }),
        });
        document.getElementById("feishuUrl").value = "";
        document.getElementById("feishuSecret").value = "";
        alert("飞书提醒通道已保存！");
        loadOverview();
      } catch (e) {
        alert(e.message);
      }
    }

    async function testFeishu() {
      try {
        const res = await api("/api/admin/feishu/test", { method: "POST" });
        alert(res.message || "测试成功");
      } catch (e) {
        alert(e.message);
      }
    }
  </script>
</body>
</html>
