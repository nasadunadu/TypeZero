name: Build TypeZero Windows (x64)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Rust stable (MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Type-check & build React frontend
        run: pnpm build

      - name: Run Rust regression test suite (0 warnings gate)
        shell: pwsh
        run: |
          $env:RUSTFLAGS = "-D warnings"
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Fetch sherpa-onnx v1.13.8 Windows x64 static-CRT DLLs
        shell: pwsh
        run: ./scripts/fetch-sherpa-win64.ps1

      - name: Build Tauri v2 Windows NSIS installer (.exe)
        run: pnpm tauri build --bundles nsis

      - name: Package NSIS installer + Portable ZIP + SHA-256
        shell: pwsh
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          $ver = $pkg.version
          $outDir = "release-artifacts"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          # 1. Copy & rename NSIS setup.exe
          $nsis = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $nsis) { throw "NSIS setup.exe not found!" }
          $setupName = "TypeZero-v$ver-Windows-x64-setup.exe"
          $setupDest = Join-Path $outDir $setupName
          Copy-Item $nsis.FullName $setupDest -Force

          # 2. Build Portable ZIP (TypeZero.exe + sherpa-onnx DLLs side-by-side)
          $portableStage = Join-Path $outDir "TypeZero-v$ver-Windows-x64-portable"
          New-Item -ItemType Directory -Force -Path $portableStage | Out-Null
          Copy-Item "src-tauri/target/release/typezero-windows.exe" (Join-Path $portableStage "TypeZero.exe") -Force
          Get-ChildItem "src-tauri/runtime" -Filter "*.dll" | ForEach-Object {
            Copy-Item $_.FullName (Join-Path $portableStage $_.Name) -Force
          }
          $zipName = "TypeZero-v$ver-Windows-x64-portable.zip"
          $zipDest = Join-Path $outDir $zipName
          Compress-Archive -Path "$portableStage\*" -DestinationPath $zipDest -Force
          Remove-Item $portableStage -Recurse -Force

          # 3. Generate SHA-256 checksums
          foreach ($file in @($setupDest, $zipDest)) {
            $hash = (Get-FileHash -Path $file -Algorithm SHA256).Hash.ToLower()
            $leaf = Split-Path -Leaf $file
            "$hash  $leaf" | Out-File -FilePath "$file.sha256" -Encoding ascii
            Write-Host "SHA256 $leaf : $hash"
          }

      - name: Upload Windows Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TypeZero-Windows-x64
          path: windows/release-artifacts/*
          retention-days: 30

      - name: Attach Windows installers to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: windows/release-artifacts/*
